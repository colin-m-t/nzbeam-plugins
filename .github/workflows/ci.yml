# Every plugin has to typecheck against the SDK file in sdk/, and pass whatever tests it brought,
# before it can be merged.
name: Typecheck

on:
  pull_request:
  push:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Not every plugin has tests; `bun test` with nothing to run is a pass.
      - run: bun test
